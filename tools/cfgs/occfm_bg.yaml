NAME: OccFM

CACHE_MODE: True
EVAL_INTERVAL: 1
LOSS_MONITOR: 'mse_loss'

DATA_CONFIG:
    _BASE_CONFIG_: tools/cfgs/dataset_configs/nuscenes_dataset.yaml
    PICKLE_PATH: {'train': './data/nusc_latent_vae/only_bg/fg_only_c16_training.pkl',
                  'test': './data/nusc_latent_vae/only_bg/fg_only_c16_validation.pkl'}
    SEM_MODE: True
    HIST_LENGTH: 4
    FORECAST_LENGTH: 6

    IOU_EVAL_LENGTH: 6 # total length to eval miou
    ROLL_OUT_LENGTH: 6 # total length of eval
    ROLL_OUT_STEP: 6

COMPRESSOR_CONFIG:
    _BASE_CONFIG_: tools/cfgs/compressor_configs/vae_swin_x16_h16.yaml
    PRETRAIN_WEIGHT: logs/occfm_vae/100ep_3docc_sem_voxel/ckpt/epoch=000100.ckpt

TRANSITION_MODEL_CONFIG:
    _BASE_CONFIG_: tools/cfgs/transition_configs/cfm.yaml
    TRANSITION_MODEL:
      TRAJECTORY_LENGTH: 4 # The length of trajectory used for training,
      SEQ_LENGTH: 10 # The overall length of sequence, should be sum of hist_last & seq_length

PLANNER_CONFIG:
    NAME: EmptyPlanner
    PASS: True

LOSS:
  UNCOND_P: 0.2
  RESCALE_FACTOR: 10
  SAMPLE_STEP: 10
  ALPHA_STEP: 3
  UNCOND_SCALE: 2

OPTIMIZATION:
    NAME: ADAM

    BATCH_SIZE_PER_GPU: 4
    NUM_EPOCHS: 200
    BASE_LR: 2.0e-05
    WARMUP_STEPS: 1000
    MIN_LR_RATIO: 0.2
    GRAD_NORM_CLIP: 5
