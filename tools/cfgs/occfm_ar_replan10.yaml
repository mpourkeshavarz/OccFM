NAME: OccFM

GEN_TRAINING: True # Skip the VAE structure
EVAL_INTERVAL: 20
LOSS_MONITOR: 'mse_loss'

# Autoregressive mode: both training and validation
AUTO_REG: True  # Enable autoregressive training (predicts 10 frames at a time)
TEACH_FORCE: True  # Enable teacher forcing (uses ground truth during training)
WITH_CFG: True  # Use classifier-free guidance during evaluation

DATA_CONFIG:
    # _BASE_CONFIG_: tools/cfgs/dataset_configs/nuscenes_dataset.yaml
    _BASE_CONFIG_: tools/cfgs/dataset_configs/waymo_dataset_occ_only.yaml
    # PICKLE_PATH: Optional - if provided, loads cached VAE latents; if not, encodes semantic_occ on-the-fly
    # Example: PICKLE_PATH: {'train': './data/waymo_latent_vae/x16/waymo_latent_train.pkl',
    #                       'test': './data/waymo_latent_vae/x16/waymo_latent_val.pkl'}
    # PICKLE_PATH: {'train': './data/waymo_latent_vae/x16/waymo_latent_train.pkl',
    #               'test': './data/waymo_latent_vae/x16/waymo_latent_val.pkl'}
    PICKLE_PATH:
        train: './data/waymo_latent_vae_4shards/x16/waymo_latent_train_shards.pkl'
        test: './data/waymo_latent_vae_4shards/x16/waymo_latent_val_shards.pkl'              
    # OCC_PATH: 'data/nuscenes'
    ONLY_BG: False
    SEM_MODE: True
    HIST_LENGTH: 10
    FORECAST_LENGTH: 80
    SEQUENCE_LENGTH: 90

    IOU_EVAL_LENGTH: 80 # total length to eval miou
    ROLL_OUT_LENGTH: 80 # total length of eval
    ROLL_OUT_STEP: 10  # For autoregressive: predict 10 frames at a time
    # iter_num = ROLL_OUT_LENGTH // ROLL_OUT_STEP = 80 // 10 = 8
    # 8 iterations, predicting 10 frames at a time autoregressively

COMPRESSOR_CONFIG:
    _BASE_CONFIG_: tools/cfgs/compressor_configs/vae_swin_x16_h16.yaml
    PRETRAIN_WEIGHT: logs/occfm_vae_occ_only_waymo/train_new/ckpt/epoch=000002.ckpt
    EMBEDDING:
        NUM_CATE: 16  # Waymo has 16 classes

TRANSITION_MODEL_CONFIG:
    _BASE_CONFIG_: tools/cfgs/transition_configs/cfm.yaml
    TRANSITION_MODEL:
      TRAJECTORY_LENGTH: 20 # For autoregressive: should be HIST_LENGTH + ROLL_OUT_STEP = 10 + 10
      SEQ_LENGTH: 20 # For autoregressive: should match TRAJECTORY_LENGTH (predicts 10 frames at a time)

PLANNER_CONFIG:
    NAME: EmptyPlanner
    PASS: True

LOSS:
  UNCOND_P: 0.2
  RESCALE_FACTOR: 10
  SAMPLE_STEP: 10
  ALPHA_STEP: 3
  UNCOND_SCALE: 2

OPTIMIZATION:
    NAME: ADAM

    BATCH_SIZE_PER_GPU: 16
    NUM_EPOCHS: 200
    BASE_LR: 2.0e-05
    WARMUP_STEPS: 1000
    MIN_LR_RATIO: 0.
    GRAD_NORM_CLIP: 5
    CKPT_SAVE_INTERVAL_BATCHES: 100  # Optional: save checkpoint every N batches (in addition to epoch-based checkpoints)



