NAME: OccFM

GEN_TRAINING: True # Skip the VAE structure
EVAL_INTERVAL: 1
LOSS_MONITOR: 'mse_loss'
AUTO_REG: True
TEACH_FORCE: False

DATA_CONFIG:
    _BASE_CONFIG_: tools/cfgs/dataset_configs/nuscenes_dataset.yaml
    PICKLE_PATH: {'train': './data/nusc_latent_vae/only_bg_c10/bg_only_c16_training.pkl',
                  'test': './data/nusc_latent_vae/only_bg_c10/bg_only_c16_validation.pkl'}
    ONLY_BG: True
    SEM_MODE: True
    HIST_LENGTH: 4
    FORECAST_LENGTH: 3 # repeat 3 times autoregressively

    IOU_EVAL_LENGTH: 6 # total length to eval miou
    ROLL_OUT_LENGTH: 6
    ROLL_OUT_STEP: 1


COMPRESSOR_CONFIG:
    _BASE_CONFIG_: tools/cfgs/compressor_configs/vae_swin_x16_h16.yaml
    PRETRAIN_WEIGHT: logs/occfm_vae_bg/new_attn/ckpt/epoch=000100.ckpt
    EMBEDDING:
      NUM_CATE: 10

TRANSITION_MODEL_CONFIG:
    _BASE_CONFIG_: tools/cfgs/transition_configs/cfm.yaml
    TRANSITION_MODEL:
      TRAJECTORY_LENGTH: 5
      SEQ_LENGTH: 5

PLANNER_CONFIG:
    NAME: EmptyPlanner
    PASS: True

LOSS:
  UNCOND_P: 0.2
  RESCALE_FACTOR: 10
  SAMPLE_STEP: 10
  ALPHA_STEP: 3
  UNCOND_SCALE: 2

OPTIMIZATION:
    NAME: ADAM

    BATCH_SIZE_PER_GPU: 6
    NUM_EPOCHS: 100
    BASE_LR: 2.0e-05
    WARMUP_STEPS: 1000
    MIN_LR_RATIO: 0.2
    GRAD_NORM_CLIP: 5
