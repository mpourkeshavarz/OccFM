NAME: OccFmVAE

GEN_TRAINING: False # Skip the VAE structure
MU_SIGMA_CACHE: False
EVAL_INTERVAL: 1
LOSS_MONITOR: 'loss'
AUTO_REG: False

DATA_CONFIG:
  _BASE_CONFIG_: tools/cfgs/dataset_configs/nuscenes_dataset.yaml
  SEM_MODE: True
  ONLY_BG: True
  PREPROCESS_STEP: ['filter_fg', 'index_reorder']

  IOU_EVAL_LENGTH: 1 # total length to eval miou
  ROLL_OUT_LENGTH: 1
  ROLL_OUT_STEP: 1

COMPRESSOR_CONFIG:
    _BASE_CONFIG_: tools/cfgs/compressor_configs/vae_swin_x16_h16.yaml
    EMBEDDING:
      NUM_CATE: 10

LOSS:
  RECON_LOSS_WEIGHT: 10
  LOVASZ_LOSS_WEIGHT: 1
  KL_DIVERGENCE_WEIGHT: 1

OPTIMIZATION:
  NAME: ADAM

  BATCH_SIZE_PER_GPU: 2
  NUM_EPOCHS: 100
  BASE_LR: 2.0e-05
  WARMUP_STEPS: 1000
  MIN_LR_RATIO: 0.2
  GRAD_NORM_CLIP: 5